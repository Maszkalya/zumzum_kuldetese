<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <style id="mighty-reset-css">/* Basic reset - lowest priority */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: sans-serif; line-height: 1.5; }</style><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Flip Cards</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      margin: 0;
      padding: 24px 24px 0;
    }

    .deck {
      display: grid;
      gap: 16px;
    }

    .card-wrap {
      perspective: 1000px;
      width: 100%;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border-radius: 16px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      border: none;
      padding: 0;
      background: transparent;
      font: inherit;
      text-align: left;
    }

    .card-inner:focus-visible {
      box-shadow: 0 0 0 3px #005fcc;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #ffffff;
      border: 2px solid #e8e8e8;
    }

    .face-image-title .face-img-area {
      width: 100%;
      flex: 1;
      overflow: hidden;
    }
    .face-image-title .face-img-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .face-image-title .face-title-area {
      width: 100%;
      padding: 12px 14px;
      text-align: center;
    }

    .face-text {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .face-text::-webkit-scrollbar { display: none; }
    .face-text-inner {
      margin: auto 0;
      width: 100%;
    }

    .card-back .face-text,
    .card-back .face-image-title {
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .card-back .face-text::-webkit-scrollbar,
    .card-back .face-image-title::-webkit-scrollbar { display: none; }

    .text-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .text-body {
      font-size: 14px;
      color: #444;
      margin: 0;
      line-height: 1.6;
    }
    .text-body p { margin: 0 0 6px; }
    .text-body p:last-child { margin-bottom: 0; }
    .text-body ul, .text-body ol { margin: 4px 0; padding-left: 20px; text-align: left; }
    .text-body strong { font-weight: 700; }
    .text-body em { font-style: italic; }
    .text-title p { margin: 0; }
    .text-title strong { font-weight: 700; }
    .text-title em { font-style: italic; }

    .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eaeaea;
    }
    .img-placeholder svg { opacity: 0.35; }

    .flip-hint {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 11px;
      color: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      z-index: 2;
    }
    .flip-hint svg { opacity: 0.5; }

    .progress-wrap {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: #e8e8e8;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #005fcc;
      border-radius: 2px;
      transition: width 0.35s ease;
      width: 0%;
    }
    .progress-label {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }
  </style>
<script id="mighty-interactive-sdk" src="../../../../mighty/sdk/v1/mighty-interactive-sdk.min.js"></script></head>
<body>

<div class="progress-wrap" id="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <span class="progress-label" id="progress-label">0 / 0</span>
</div>
<div class="deck" id="deck"></div>

<script>
const sdk = window.mightyInteractiveSdk;

sdk.onSdkReady(async () => {
  const config = await sdk.state.getState({
    requireAllFlipped: true,
    columns: 4,
    mobileColumns: 2,
    aspectRatio: '1:1',
    customRatioW: 1,
    customRatioH: 1,
    maxCardWidth: 0,
    deckPadding: 24,
    borderRadius: 16,
    frontBgColour: '#f4f4f4',
    backBgColour: '#ffffff',
    titleColour: '#1a1a1a',
    bodyColour: '#444444',
    titleFontSize: 15,
    bodyFontSize: 14,
    cards: [
      { frontType: 'image-title', frontTitle: 'Card title 1', frontImageUrl: '', backType: 'text', backTitle: 'Back title 1', backBody: 'Replace this with your description or key information for card 1.' },
      { frontType: 'image-title', frontTitle: 'Card title 2', frontImageUrl: '', backType: 'text', backTitle: 'Back title 2', backBody: 'Replace this with your description or key information for card 2.' },
      { frontType: 'image-title', frontTitle: 'Card title 3', frontImageUrl: '', backType: 'text', backTitle: 'Back title 3', backBody: 'Replace this with your description or key information for card 3.' },
      { frontType: 'image-title', frontTitle: 'Card title 4', frontImageUrl: '', backType: 'text', backTitle: 'Back title 4', backBody: 'Replace this with your description or key information for card 4.' }
    ]
  });

  sdk.registerTracking({
    completion: {
      description: config.requireAllFlipped !== false
        ? 'Completes once the learner has flipped every card'
        : 'Autocompletes on load'
    }
  });

  const requireAllFlipped = config.requireAllFlipped !== false;
  const cols              = config.columns       || 4;
  const mobileCols        = config.mobileColumns || 2;
  const radius            = config.borderRadius  != null ? config.borderRadius : 16;
  const maxW              = config.maxCardWidth  || 0;
  const deckPad           = config.deckPadding   != null ? config.deckPadding : 24;
  const frontBg           = config.frontBgColour || '#f4f4f4';
  const backBg            = config.backBgColour  || '#ffffff';
  const titleColour       = config.titleColour   || '#1a1a1a';
  const bodyColour        = config.bodyColour    || '#444444';
  const titleSize         = config.titleFontSize || 15;
  const bodySize          = config.bodyFontSize  || 14;
  const cards             = config.cards         || [];

  const RATIOS = { '1:1':'1/1', '4:3':'4/3', '3:4':'3/4', '16:9':'16/9', '9:16':'9/16' };
  const ratioKey = config.aspectRatio || '1:1';
  const cssRatio = ratioKey === 'custom'
    ? `${config.customRatioW || 1}/${config.customRatioH || 1}`
    : (RATIOS[ratioKey] || '1/1');

  const deck          = document.getElementById('deck');
  const progressFill  = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');
  const progressWrap  = document.getElementById('progress-wrap');

  deck.style.padding         = `0 ${deckPad}px`;
  progressWrap.style.padding = `0 ${deckPad}px`;

  // Hide progress bar if completion is immediate
  if (!requireAllFlipped) {
    progressWrap.style.display = 'none';
    sdk.markAsComplete();
  }


  function setColumns() {
    const isMobile = window.innerWidth < 600;
    const activeCols = isMobile ? mobileCols : cols;
    deck.style.gridTemplateColumns = maxW > 0
      ? `repeat(${activeCols}, minmax(0, ${maxW}px))`
      : `repeat(${activeCols}, minmax(0, 1fr))`;
  }
  setColumns();
  window.addEventListener('resize', setColumns);

  if (!cards.length) {
    deck.innerHTML = '<p style="color:#999;font-size:14px;text-align:center;padding:2rem;">No cards configured yet.</p>';
    sdk.markAsComplete();
    return;
  }

  const total      = cards.length;
  const cardInners = [];
  const flipped    = new Set();

  function updateProgress() {
    const count = flipped.size;
    const pct   = total > 0 ? (count / total) * 100 : 0;
    progressFill.style.width  = pct + '%';
    progressLabel.textContent = `${count} / ${total}`;
    if (requireAllFlipped && count === total) {
      sdk.markAsComplete();
    }
  }

  if (requireAllFlipped) updateProgress();

  cards.forEach((card, i) => {
    const wrap = document.createElement('div');
    wrap.className      = 'card-wrap';
    wrap.style.aspectRatio = cssRatio;

    const inner = document.createElement('button');
    inner.className     = 'card-inner';
    inner.style.borderRadius = radius + 'px';
    inner.setAttribute('aria-label', `${card.frontTitle || `Card ${i + 1}`} — press Enter or Space to flip`);
    inner.setAttribute('aria-pressed', 'false');

    inner.innerHTML = buildFace(card, 'front', { radius, frontBg, backBg, titleSize, bodySize, titleColour, bodyColour })
                    + buildFace(card, 'back',  { radius, frontBg, backBg, titleSize, bodySize, titleColour, bodyColour });

    function flipCard() {
      const isFlipped = inner.classList.toggle('flipped');
      inner.setAttribute('aria-pressed', String(isFlipped));
      if (isFlipped) {
        flipped.add(i);
        inner.setAttribute('aria-label', `${card.backTitle || card.frontTitle || `Card ${i + 1}`} — press Enter or Space to flip back`);
      } else {
        inner.setAttribute('aria-label', `${card.frontTitle || `Card ${i + 1}`} — press Enter or Space to flip`);
      }
      if (requireAllFlipped) updateProgress();
    }

    inner.addEventListener('click', flipCard);
    inner.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipCard();
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (cardInners[i + 1]) cardInners[i + 1].focus();
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (cardInners[i - 1]) cardInners[i - 1].focus();
      }
    });

    wrap.appendChild(inner);
    deck.appendChild(wrap);
    cardInners.push(inner);
  });

  requestAnimationFrame(() => { setColumns(); });
});

function buildFace(card, side, style) {
  const { radius, frontBg, backBg, titleSize, bodySize, titleColour, bodyColour } = style || {};
  const type     = side === 'front' ? card.frontType : card.backType;
  const imageUrl = side === 'front'
    ? (card.frontImage ? card.frontImage.url : card.frontImageUrl || '')
    : (card.backImage  ? card.backImage.url  : card.backImageUrl  || '');
  const title    = side === 'front' ? card.frontTitle : card.backTitle;
  const body     = side === 'front' ? card.frontBody  : card.backBody;
  const isBack   = side === 'back';
  const faceClass = isBack ? 'card-face card-back' : 'card-face';
  const bgColour  = isBack ? (backBg  || '#ffffff') : (frontBg || '#f4f4f4');
  const r         = (radius != null ? radius : 16) + 'px';
  const faceStyle = `background:${bgColour};border-radius:${r};`;

  const imgTag = imageUrl
    ? `<img src="${esc(imageUrl)}" alt="${esc(stripHtml(title || ''))}" style="width:100%;height:100%;object-fit:cover;display:block;">`
    : `<div class="img-placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`;

  const tSize = (titleSize || 15) + 'px';
  const bSize = (bodySize  || 14) + 'px';

  const titleHtml = isRichText(title) ? title : escWithBreaks(title || '');
  const bodyHtml  = isRichText(body)  ? body  : escWithBreaks(body  || '');

  let inner = '';
  if (type === 'image') {
    inner = `<div style="width:100%;height:100%;">${imgTag}</div>`;
  } else if (type === 'image-title') {
    inner = `<div class="face-image-title" style="width:100%;height:100%;display:flex;flex-direction:column;">
      <div class="face-img-area">${imgTag}</div>
      <div class="face-title-area" style="background:${bgColour};">
        ${title ? `<div class="text-title" style="font-size:${tSize};margin-bottom:${body ? '4px' : '0'};color:${titleColour || '#1a1a1a'};">${titleHtml}</div>` : ''}
        ${body  ? `<div class="text-body"  style="font-size:${bSize};color:${bodyColour || '#444444'};">${bodyHtml}</div>` : ''}
      </div>
    </div>`;
  } else {
    inner = `<div class="face-text">
      <div class="face-text-inner">
        ${title ? `<div class="text-title" style="font-size:${tSize};color:${titleColour || '#1a1a1a'};">${titleHtml}</div>` : ''}
        ${body  ? `<div class="text-body"  style="font-size:${bSize};color:${bodyColour || '#444444'};">${bodyHtml}</div>`  : ''}
      </div>
    </div>`;
  }

  const hint = !isBack
    ? `<span class="flip-hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> flip</span>`
    : '';

  return `<div class="${faceClass}" style="${faceStyle}" aria-hidden="${isBack ? 'true' : 'false'}">${inner}${hint}</div>`;
}

function isRichText(str) {
  return typeof str === 'string' && /<[a-z][\s\S]*>/i.test(str);
}
function stripHtml(str) {
  return String(str).replace(/<[^>]*>/g, '');
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escWithBreaks(str) {
  return esc(str).replace(/\n/g, '<br>');
}
</script>



<link rel="stylesheet" href="../../../../mighty/mighty-additional-fonts.css"><link rel="stylesheet" href="../../../../mighty/mighty-global-styles.css"><link rel="stylesheet" href="../../../../mighty/mighty-interactive-body-font.css"></body></html>
